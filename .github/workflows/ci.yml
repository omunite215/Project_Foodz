name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: Lint, types, security rules, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for the secret scan
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/setup-env.mjs

      - name: Static checks
        run: node scripts/verify.mjs lint format typecheck architecture
      - name: Security rules (Semgrep) and secret scan (gitleaks)
        run: node scripts/verify.mjs semgrep secrets
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Unit tests with coverage
        run: npx vitest run --project unit --coverage
      - name: Integration tests (Postgres + Valkey containers)
        run: node scripts/verify.mjs integration

      - name: Build
        run: node scripts/verify.mjs build
      - name: Storybook build
        run: node scripts/verify.mjs storybook
      - run: npx playwright install --with-deps chromium
      # The storefront pages read the menu, so the browser tests need a seeded database. The
      # account tests also need the sample accounts (SEED_SAMPLE_ACCOUNTS=true in .env.example),
      # the email path (the Inngest dev server hands jobs to the app, which sends to Mailpit),
      # and two values the seed prints: the seeded admin's authenticator secret and the sample
      # accounts' password. The output goes to a file in the runner's temp folder, never the log.
      - name: Start the stack and seed it
        run: |
          docker compose up -d --wait db redis mail jobs
          npx prisma migrate deploy
          npx tsx prisma/seed.ts > "$RUNNER_TEMP/seed-output.txt"
      - name: Browser tests
        env:
          E2E_SEED_OUTPUT: ${{ runner.temp }}/seed-output.txt
          # Test-only: the app takes each test's own X-Forwarded-For as its address.
          CLIENT_IP_FROM_HEADER: '1'
        run: node scripts/verify.mjs e2e

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  image:
    name: Container image scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build --target runner -t foodz-app:${{ github.sha }} .
      - name: Scan for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: foodz-app:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  dast:
    name: Dynamic scan (OWASP ZAP baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node scripts/setup-env.mjs
      - name: Start the full stack
        env:
          # The scan needs no sample accounts, and their password would land in the job's logs.
          SEED_SAMPLE_ACCOUNTS: 'false'
        run: |
          docker compose --profile app up -d --build
          for i in $(seq 1 60); do
            curl -fsS http://localhost:3456/api/health && exit 0
            sleep 3
          done
          docker compose --profile app logs --tail 100
          exit 1
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:3456
          allow_issue_writing: false
          fail_action: true
          cmd_options: '-I'
          rules_file_name: .zap/rules.tsv
      - if: always()
        run: docker compose --profile app logs app --tail 200

  infra:
    name: Infrastructure (CDK synth and cdk-nag)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx vitest run
      # No AWS credentials and no account lookups. cdk-nag (AwsSolutions) runs during synth, and
      # a finding that is not acknowledged with a written reason fails the step.
      - name: Synthesize with cdk-nag
        run: npx cdk synth --quiet -c pusherKey=ci -c turnstileSiteKey=ci
      - run: npm audit --omit=dev --audit-level=high
