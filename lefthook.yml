# Git hooks. Never bypass them with --no-verify; fix the failure instead.

pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: '*.{ts,tsx,mts,mjs,cjs,js,json,css,md,yml,yaml,toml}'
      # The flag keeps a commit whose matched files are all ignored (package-lock.json, say) passing.
      run: npx oxfmt --write --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: lint
      glob: '*.{ts,tsx,mts,mjs,cjs,js}'
      run: npx oxlint --type-aware {staged_files}
    - name: related-tests
      glob: '*.{ts,tsx}'
      run: npx vitest related --run --project unit --passWithNoTests {staged_files}
    - name: secrets
      run: node scripts/verify.mjs secrets-staged

pre-push:
  jobs:
    - name: clean-tree
      run: node scripts/verify.mjs clean-tree
    - name: verify
      run: npm run verify
